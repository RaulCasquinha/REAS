worker_processes 4;

events {
  worker_connections 4096;
}

http {
  upstream reas-g04.dyn.users.fil.isel.pt {
    server wordpress1;
    server wordpress2;
    server wordpress3;
  }

  server { 
    listen 80;

    location / {
      proxy_pass http://reas-g04.dyn.users.fil.isel.pt;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
