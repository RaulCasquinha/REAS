services:
  db:
    image: mariadb:11
    command: >
      --wsrep-on=ON
      --wsrep-provider=/usr/lib/galera/libgalera_smm.so
      --wsrep-cluster-name=wp_cluster
      --wsrep-cluster-address=gcomm://
      --wsrep-node-name=db
      --wsrep-node-address=db
      --wsrep-sst-method=mariabackup
      --wsrep-sst-auth=root:reas2024
      --wsrep-new-cluster
      --binlog-format=ROW
      --default-storage-engine=InnoDB
      --innodb-autoinc-lock-mode=2
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=reas2024
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wordpress
      - MYSQL_PASSWORD=wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5 
  db2:
    image: mariadb:11
    command: >
      --wsrep-on=ON
      --wsrep-provider=/usr/lib/galera/libgalera_smm.so
      --wsrep-cluster-name=wp_cluster
      --wsrep-cluster-address=gcomm://db,db2,db3
      --wsrep-node-name=db2
      --wsrep-node-address=db2
      --wsrep-sst-method=mariabackup
      --wsrep-sst-auth=root:reas2024
      --binlog-format=ROW
      --default-storage-engine=InnoDB
      --innodb-autoinc-lock-mode=2
    environment:
      - MARIADB_ROOT_PASSWORD=reas2024
    volumes:
      - db_data2:/var/lib/mysql
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized", "--galera_online"]
      interval: 10s
      timeout: 5s
      retries: 10
  db3:
    image: mariadb:11
    command: >
      --wsrep-on=ON
      --wsrep-provider=/usr/lib/galera/libgalera_smm.so
      --wsrep-cluster-name=wp_cluster
      --wsrep-cluster-address=gcomm://db,db2,db3
      --wsrep-node-name=db3
      --wsrep-node-address=db3
      --wsrep-sst-method=mariabackup
      --wsrep-sst-auth=root:reas2024
      --binlog-format=ROW
      --default-storage-engine=InnoDB
      --innodb-autoinc-lock-mode=2
    environment:
      - MARIADB_ROOT_PASSWORD=reas2024
    volumes:
      - db_data3:/var/lib/mysql
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized", "--galera_online"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress1:
    image: wordpress:latest
    volumes:
      - wp_data:/var/www/html
    restart: always
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress
      - WORDPRESS_DB_NAME=wordpress
  
  wordpress2:
    image: wordpress:latest
    volumes:
      - wp_data:/var/www/html
    restart: always
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress
      - WORDPRESS_DB_NAME=wordpress
  
  wordpress3:
    image: wordpress:latest
    volumes:
      - wp_data:/var/www/html
    restart: always
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress
      - WORDPRESS_DB_NAME=wordpress
  
  nginx:
    image: nginx:latest
    ports:
      - 80:80
    depends_on:
      - wordpress1
      - wordpress2
      - wordpress3
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

volumes:
  db_data:
  db_data2:
  db_data3:
  wp_data:
