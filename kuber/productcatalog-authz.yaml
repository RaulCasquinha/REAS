apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: productcatalog-access
  namespace: default
spec:
  selector:
    matchLabels:
      app: productcatalogservice
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/default/sa/frontend"]
    to:
    - operation:
        methods: ["GET", "POST"]
